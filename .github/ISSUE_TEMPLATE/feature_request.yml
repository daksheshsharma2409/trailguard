name: Feature request
description: Suggest an idea, a new rule, or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like trailguard to do?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: For a new scanner rule, show a code snippet that should be flagged and one that should not.
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to work on this myself