name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Unit + scan tests (no DB required) ────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify CLI --version
        run: node bin/trailguard.js --version

  # ── Integration tests (PostgreSQL required) ──────────────────────────────
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Only run on Node 20 for integration tests (saves CI minutes)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: trailguard_test
        options: >-
          --health-cmd "pg_isready -U root -d trailguard_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Integration tests
        run: npm run test:int
        env:
          TEST_DATABASE_URL: postgresql://root:root@localhost:5432/trailguard_test?schema=public
          DATABASE_URL: postgresql://root:root@localhost:5432/trailguard_test?schema=public
          TRAILGUARD_KEY: demo-trailguard-master-key-32chars!!
          JWT_SECRET: demo-jwt-secret-key-12345

  # ── Self-audit on fixed demo app (T7.5) ──────────────────────────────────
  demo-audit-clean:
    name: Self-audit demo (fixed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run trailguard ci --no-db on fixed demo app
        run: node bin/trailguard.js ci --config examples/demo-app/trailguard.config.ts --no-db --fail-on high

  # ── Self-audit expected failure on vulnerable demo app (T7.5) ─────────────
  demo-audit-vulnerable:
    name: Self-audit demo (vulnerable, expected failure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply vulnerable patch
        run: npm run demo:break
      - name: Assert trailguard ci fails with exit code 1 when findings >= high
        run: |
          set +e
          node bin/trailguard.js ci --config examples/demo-app/trailguard.config.ts --no-db --fail-on high
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "Expected exit code 1 from vulnerable demo app, but got $EXIT_CODE"
            exit 1
          fi
          echo "Verified: vulnerable demo correctly failed with exit code 1"
