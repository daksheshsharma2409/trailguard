services:
  postgres:
    image: postgres:16-alpine
    container_name: trailguard-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: trailguard_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d trailguard_test"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - trailguard-postgres-data:/var/lib/postgresql/data

volumes:
  trailguard-postgres-data:

